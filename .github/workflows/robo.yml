name: Executar Robo
on:
  workflow_dispatch:

concurrency:
  group: automacao-assim-orbita
  cancel-in-progress: true

jobs:
  run-robo:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: Instalar dependencias
        run: npm ci
      
      - name: Cache do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}  
          restore-keys: |
            playwright-${{ runner.os }}-
      
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
  
      - name: Executar robo
        run: node robo-v3.3.js
        env:
          SENHA: ${{ secrets.SENHA }}
          ORBITA_USER: ${{ secrets.ORBITA_USER }}
          ORBITA_PASS: ${{ secrets.ORBITA_PASS }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    
      - name: Upload de Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e-relatorios
          path: |
            logs/*.txt
            relatorios/*.xlsx
